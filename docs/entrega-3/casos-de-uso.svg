<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama UML de casos de uso de BIMetrics</title>
  <desc id="desc">El equipo técnico prepara, exporta, consulta y duplica presupuestos. El administrador mantiene el catálogo. El cliente consulta el presupuesto compartido. Preparar incluye calcular, duplicar extiende el historial y exportar se puede iniciar desde la consulta.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#334155" stroke-width="1.3"/>
    </marker>
    <g id="actor" fill="none" stroke="#172554" stroke-width="2">
      <circle cy="-29" r="10"/>
      <path d="M0 -19V14M-22 -8H22M0 14L-16 34M0 14L16 34"/>
    </g>
  </defs>
  <rect width="1120" height="750" fill="#fff"/>
  <rect x="210" y="55" width="710" height="638" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="235" y="90" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#172554">BIMetrics</text>
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <path d="M134 190H256M134 205L256 367M134 215L256 539"/>
    <path d="M995 450H875"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)">
    <path d="M518 190H602"/>
    <path d="M607 544H527"/>
    <path d="M513 380L616 425"/>
  </g>
  <g fill="#e0e7ff" stroke="#3730a3" stroke-width="1.8">
    <ellipse cx="387" cy="190" rx="131" ry="46"/>
    <ellipse cx="738" cy="190" rx="132" ry="46"/>
    <ellipse cx="387" cy="365" rx="132" ry="46"/>
    <ellipse cx="738" cy="450" rx="137" ry="47"/>
    <ellipse cx="387" cy="544" rx="140" ry="46"/>
    <ellipse cx="738" cy="544" rx="131" ry="46"/>
    <ellipse cx="737" cy="317" rx="143" ry="45"/>
  </g>
  <path d="M995 193L875 305" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#172554" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">
    <text x="387" y="185"><tspan x="387">Preparar</tspan><tspan x="387" dy="21">presupuesto</tspan></text>
    <text x="738" y="196">Calcular costo y AIU</text>
    <text x="387" y="371">Exportar documento</text>
    <text x="738" y="445"><tspan x="738">Consultar presupuesto</tspan><tspan x="738" dy="21">compartido</tspan></text>
    <text x="387" y="550">Consultar historial</text>
    <text x="738" y="550">Duplicar presupuesto</text>
    <text x="737" y="313"><tspan x="737">Administrar catálogo</tspan><tspan x="737" dy="21">maestro por API</tspan></text>
    <text x="106" y="249"><tspan x="106">Equipo técnico</tspan><tspan x="106" dy="20">Arquitectura e ingeniería</tspan></text>
    <text x="1025" y="244">Administrador</text>
    <text x="1025" y="510">Cliente</text>
  </g>
  <g fill="#334155" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">
    <text x="560" y="174">«include»</text>
    <text x="566" y="527">«extend»</text>
    <text x="568" y="393">«extend»</text>
  </g>
  <use href="#actor" x="106" y="187"/>
  <use href="#actor" x="1025" y="182"/>
  <use href="#actor" x="1025" y="448"/>
  <text x="28" y="727" fill="#475569" font-family="Arial,sans-serif" font-size="14">Las asociaciones representan los flujos implementados. Los casos de negocio requieren una sesión vigente.</text>
