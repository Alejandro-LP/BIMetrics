components:
  schemas:
    AIU:
      type: object
      description: Porcentajes sobre el costo directo. Cada valor debe estar entre 0 y 100; el servidor redondea cada componente monetario a dos decimales.
      properties:
        administracion: { type: number, minimum: 0, maximum: 100, default: 0 }
        imprevistos: { type: number, minimum: 0, maximum: 100, default: 0 }
        utilidad: { type: number, minimum: 0, maximum: 100, default: 0 }
      additionalProperties: false
    Registro:
      type: object
      required: [nombre_completo, email, password, rol, autoriza_datos]
      properties:
        nombre_completo: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 150 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        rol: { type: string, enum: [arquitecto, ingeniero, cliente] }
        autoriza_datos: { type: boolean, const: true }
    ActividadBIM:
      type: object
      required: [id_usuario, tipo_evento]
      properties:
        id_usuario: { type: integer, minimum: 1 }
        id_proyecto: { type: [integer, 'null'], minimum: 1 }
        tipo_evento: { type: string, maxLength: 100 }
        software_origen: { type: string, maxLength: 120 }
        nombre_archivo: { type: string, maxLength: 255 }
        estado: { type: string, enum: [completado, advertencia, fallido] }
        detalles_bim: { type: object, description: "Objeto JSON flexible, máximo 1 MB" }
    Insumo:
      type: object
      required: [nombre_insumo, unidad_medida, costo_unitario]
      properties:
        nombre_insumo: { type: string, minLength: 1, maxLength: 150 }
        unidad_medida: { type: string, minLength: 1, maxLength: 30 }
        costo_unitario: { type: number, minimum: 0 }
        ciudad: { type: string, maxLength: 100 }
    Partida:
      type: object
      required: [codigo, unidad, descripcion]
      properties:
        codigo: { type: string, minLength: 1, maxLength: 50 }
        unidad: { type: string, minLength: 1, maxLength: 50 }
        descripcion: { type: string, minLength: 1, maxLength: 10000 }
        precio_defecto: { type: number, minimum: 0, default: 0 }
        variaciones:
          type: array
          items:
            type: object
            required: [tipo]
            properties:
              tipo: { type: string, minLength: 1, maxLength: 100 }
              opcion: { type: [string, 'null'] }
              parametro: { type: [string, 'null'], maxLength: 255 }
              valor_probado: { type: [string, 'null'], maxLength: 255 }
              es_defecto: { type: boolean, default: false }
              precio: { type: [number, 'null'], minimum: 0 }
    UsuarioAdmin:
      type: object
      required: [nombre_completo, email, rol, password]
      properties:
        nombre_completo: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email }
        rol: { type: string, enum: [cliente, arquitecto, ingeniero, administrador] }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Cookie firmada de sesión Flask, emitida al registrarse o iniciar sesión.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri }
      description: Debe coincidir con uno de los orígenes definidos en CORS_ORIGIN.
  responses:
    BadRequest:
      description: Solicitud o datos inválidos
    Unauthorized:
      description: Se requiere una sesión válida
    Forbidden:
      description: El rol o el origen no tiene permiso
    NotFound:
      description: Recurso no encontrado o no accesible
    Conflict:
      description: El recurso entra en conflicto con datos existentes
    Unavailable:
      description: Una base de datos requerida no está disponible
security:
  - sessionCookie: []
